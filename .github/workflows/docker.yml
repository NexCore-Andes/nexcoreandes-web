# Cada vez que se sube un cambio a main, arma la imagen Docker del sitio
# y la publica en GitHub Container Registry (ghcr.io).
name: Imagen Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nexcore-andes/nexcoreandes-web:latest
            ghcr.io/nexcore-andes/nexcoreandes-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
