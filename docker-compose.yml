# Proyecto para el Docker Manager de Hostinger (pegar en "Editor .yaml").
# El VPS descarga el código de GitHub y arma el sitio ahí mismo con el Dockerfile.
# TU_TOKEN = token de GitHub de solo lectura para este repositorio (ver README).
services:
  web:
    build:
      context: https://TU_TOKEN@github.com/NexCore-Andes/nexcoreandes-web.git#main
    container_name: nexcoreandes-web
    restart: unless-stopped
    ports:
      - "80:3000"   # si el puerto 80 ya lo usa otro proyecto, cambialo, por ejemplo "8080:3000"
    environment:
      NODE_ENV: production
      # INSTAGRAM_ACCESS_TOKEN: pegá acá el token cuando reactives la sección de Instagram
